<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blast-Radius PR Reviewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header>
            <p class="eyebrow">Pre-Landing Review</p>
            <h1>Blast-Radius PR Reviewer</h1>
            <p class="lede">Low-noise guesses about what might break when this PR lands.</p>
        </header>

        <section class="card">
            <div class="form-row">
                <input id="pr-url" type="text" placeholder="https://github.com/owner/repo/pull/123">
                <button id="analyze-btn">Run Review</button>
            </div>
            <pre id="review-output">Enter a PR URL to get the top blast-radius findings.</pre>
        </section>

        <section class="logs">
            <div class="logs-header">
                <span>Logs</span>
                <button id="refresh-logs-btn">Refresh</button>
            </div>
            <pre id="log-area"></pre>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
