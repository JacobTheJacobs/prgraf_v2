[project]
name = "prgraf"
version = "0.1.0"
description = "Low-noise blast-radius PR reviewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "loguru>=0.7.3",
    "uvicorn>=0.29.0",
]

[project.scripts]
prgraf = "codebase_rag.api:main"

[tool.setuptools.packages.find]
include = ["codebase_rag*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
