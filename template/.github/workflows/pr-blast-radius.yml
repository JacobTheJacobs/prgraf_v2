# prgraf blast-radius review — runs on every PR open/update.
# Copy this file into your repo as:
#   .github/workflows/pr-blast-radius.yml
#
# Then either:
#   A) Vendor the prgraf package under tools/prgraf/ and set PRGRAF_PATH below, or
#   B) Point PRGRAF_PATH at a clone of prgraf_v2 on the runner (self-hosted).

name: PR Blast-Radius Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    name: Blast-radius review
    runs-on: ubuntu-latest
    # Skip draft PRs unless you remove this.
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prgraf
        env:
          # Path to the prgraf package root (has pyproject.toml).
          # Default: tools/prgraf. Override with repo variable PRGRAF_PATH.
          PRGRAF_PATH: ${{ vars.PRGRAF_PATH }}
        run: |
          PRGRAF_PATH="${PRGRAF_PATH:-tools/prgraf}"
          if [ ! -f "$PRGRAF_PATH/pyproject.toml" ]; then
            echo "::error::prgraf not found at $PRGRAF_PATH"
            echo "Copy prgraf_v2 into tools/prgraf, or set repo variable PRGRAF_PATH."
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install -e "$PRGRAF_PATH"

      - name: Run blast-radius review
        id: review
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          prgraf \
            --repo . \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --output prgraf-report.md \
            --fail-on none \
            --quiet
          {
            echo "report<<EOF"
            cat prgraf-report.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: prgraf-report
          path: prgraf-report.md
          if-no-files-found: error

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('prgraf-report.md', 'utf8');
            const marker = '<!-- prgraf-blast-radius -->';
            const full = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: full,
              });
            }
