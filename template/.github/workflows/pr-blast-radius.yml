# prgraf blast-radius review — runs on every PR open/update.
# Copy this file into your repo as:
#   .github/workflows/pr-blast-radius.yml
#
# Then either:
#   A) Vendor the prgraf package under tools/prgraf/ and set PRGRAF_PATH below, or
#   B) Point PRGRAF_PATH at a clone of prgraf_v2 on the runner (self-hosted).

name: PR Blast-Radius Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    name: Blast-radius review
    runs-on: ubuntu-latest
    # Skip draft PRs unless you remove this.
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prgraf
        env:
          # Path to the prgraf package root (has pyproject.toml).
          # Default: tools/prgraf. Override with repo variable PRGRAF_PATH.
          PRGRAF_PATH: ${{ vars.PRGRAF_PATH }}
        run: |
          PRGRAF_PATH="${PRGRAF_PATH:-tools/prgraf}"
          if [ ! -f "$PRGRAF_PATH/pyproject.toml" ]; then
            echo "::error::prgraf not found at $PRGRAF_PATH"
            echo "Copy prgraf_v2 into tools/prgraf, or set repo variable PRGRAF_PATH."
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install -e "$PRGRAF_PATH"

      - name: Run blast-radius review
        id: review
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          prgraf \
            --repo . \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --output prgraf-report.md \
            --fail-on none \
            --quiet
          # The job summary works on every PR, including forks.
          cat prgraf-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: prgraf-report
          path: prgraf-report.md
          if-no-files-found: error

      # Fork PRs get a read-only GITHUB_TOKEN, so commenting would 403. They
      # still get the artifact and the job summary above. Don't switch to
      # pull_request_target to "fix" this: it runs the PR's code with a write
      # token.
      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        # A comment is a convenience; never fail the review over it.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- prgraf-blast-radius -->';
            // GitHub rejects comment bodies over 65,536 characters.
            const LIMIT = 65000;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = fs.readFileSync('prgraf-report.md', 'utf8');
            if (marker.length + 1 + body.length > LIMIT) {
              const note = `\n\n---\n_Report truncated. Full report: \`prgraf-report\` artifact on [this run](${runUrl})._\n`;
              body = body.slice(0, LIMIT - marker.length - 1 - note.length) + note;
            }
            const full = `${marker}\n${body}`;

            try {
              // Paginate: past 30 comments the marker comment would be missed
              // and a duplicate posted.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: full,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: full,
                });
              }
            } catch (err) {
              core.warning(`Could not comment on the PR (${err.status || ''} ${err.message}). See the job summary or the prgraf-report artifact.`);
            }
